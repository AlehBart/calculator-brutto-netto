<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калькулятор Брутто-Нетто Польша</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background-color: #f4f6f8;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    label {
      font-weight: bold;
      margin-top: 15px;
      color: #34495e;
    }
    select, input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      background-color: #fff;
    }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      margin-top: 20px;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }
    button:hover {
      background-color: #2980b9;
    }
    button:active {
      transform: scale(0.97);
    }
    .result {
      margin-top: 25px;
      padding: 15px;
      background-color: #ecf0f1;
      border-left: 5px solid #3498db;
      font-weight: bold;
      font-size: 1.2rem;
      color: #2c3e50;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .result.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <h1>Калькулятор брутто-нетто в Польше</h1>

  <label for="contractType">Тип договора:</label>
  <select id="contractType">
    <option value="etatu">Umowa o pracę (трудовой договор)</option>
    <option value="zlecenie">Umowa zlecenie (гражданский договор)</option>
    <option value="dzielo">Umowa o dzieło (договор подряда)</option>
    <option value="b2b">B2B (самозанятость)</option>
  </select>

  <label for="brutto">Сумма брутто (зл.):</label>
  <input type="number" id="brutto" min="0" placeholder="Например, 5000" />

  <button onclick="calculateNetto()">Рассчитать нетто</button>

  <div class="result" id="nettoResult"></div>

  <script>
    function calculateNetto() {
      const contract = document.getElementById('contractType').value;
      const brutto = parseFloat(document.getElementById('brutto').value);
      const resultBlock = document.getElementById('nettoResult');
      let netto = 0;

      resultBlock.classList.remove('show');

      if (isNaN(brutto) || brutto <= 0) {
        resultBlock.innerText = 'Введите корректную сумму брутто.';
        resultBlock.classList.add('show');
        return;
      }

      switch (contract) {
        case 'etatu': netto = brutto * 0.715; break;
        case 'zlecenie': netto = brutto * 0.74; break;
        case 'dzielo': netto = brutto * 0.80; break;
        case 'b2b': netto = brutto * 0.81; break;
      }

      resultBlock.innerText = `Примерная сумма нетто: ${netto.toFixed(2)} зл.`;
      resultBlock.classList.add('show');
    }
  </script>
</body>
</html>
